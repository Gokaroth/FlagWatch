# fly.toml — FlagWatch (Bulgarian Black Sea beach-safety + water-cleanliness PWA)
# Single always-on machine in Frankfurt. The 2h Copernicus collector runs in-process, so the
# machine must stay awake (auto_stop_machines = 'off', min_machines_running = 1). A volume holds
# the snapshot + condition history across deploys/restarts.
#
# If the global app name 'flagwatch' is taken, change it here (e.g. 'flagwatch-eu') and use the
# same name in `fly certs add`.

app = 'flagwatch'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  STATE_DIR = '/state'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[mounts]
  source = 'flagwatch_state'
  destination = '/state'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
